<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f6fd">
<title>QUIZ MASTER – Hóa học phân tích</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M24 12h16M27 12v14L16 48a3 3 0 0 0 2.7 4h26.6A3 3 0 0 0 48 48L37 26V12M21 40h22' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--fscale:1;--bg:#f2f6fd;--card:#fff;--card2:#f7f9fe;--ink:#0e1d3b;--muted:#5a6a89;--line:#e0e8f5;--navy:#0b2a5b;--blue:#2563eb;--blue2:#4f9bff;--blueSoft:#e8f0ff;--ok:#0f9d58;--okSoft:#e4f6ec;--bad:#dc3c43;--badSoft:#fdeaea;--warn:#e69a0c;--warnSoft:#fff4de;--shadow:0 1px 2px rgba(11,42,91,.06),0 8px 24px rgba(11,42,91,.07);--r:18px;--nav:64px}
:root[data-theme=dark]{--bg:#0a1226;--card:#111b36;--card2:#15213f;--ink:#e8eefc;--muted:#97a8cb;--line:#223255;--blue:#5b9bff;--blue2:#7fb4ff;--blueSoft:#172a52;--ok:#34c47c;--okSoft:#10301f;--bad:#ff6b72;--badSoft:#3a1519;--warn:#ffb83d;--warnSoft:#3a2b0a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--fscale));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;overflow-x:hidden;min-width:320px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}
sub,sup{line-height:0}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
svg.i.on{fill:currentColor}
.shell{display:flex;min-height:100vh}
.side{display:none;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:18px 14px;background:var(--card);border-right:1px solid var(--line);flex-direction:column;gap:4px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;color:var(--navy)}
:root[data-theme=dark] .logo{color:#fff}
.logo .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#0b2a5b,#2f7cf6);display:grid;place-items:center;color:#fff;flex:none}
.logo small{display:block;font-weight:600;font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.side .logo{padding:4px 8px 16px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.94rem;transition:.15s}
.nav a:hover{background:var(--blueSoft);color:var(--blue)}
.nav a.on{background:linear-gradient(135deg,#0b2a5b,#2563eb);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.nav a .cnt{margin-left:auto;font-size:.72rem;background:var(--blueSoft);color:var(--blue);padding:1px 8px;border-radius:99px}
.nav a.on .cnt{background:rgba(255,255,255,.2);color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .logo .mark{width:32px;height:32px;border-radius:10px}
.view{width:100%;max-width:1080px;margin:0 auto;padding:16px 16px calc(var(--nav) + 28px + env(safe-area-inset-bottom));animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:.68rem;font-weight:600;min-width:0}
.bnav a.on{color:var(--blue)}
.bnav svg.i{width:1.5em;height:1.5em}
body.inrun .bnav,body.inrun .top{display:none}
body.inrun .view{padding-bottom:110px}
@media (min-width:900px){.side{display:flex}.top,.bnav{display:none}.view{padding:28px 32px 48px}body.inrun .view{padding-bottom:48px}}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.page-h h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.page-h p{color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card+.card,.card+.grid,.grid+.card,.grid+.grid{margin-top:14px}
.card h2{font-size:1.05rem;font-weight:800;margin-bottom:10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c1{grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.grid.c3,.grid.c4{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px){.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#3d8bff 0%,transparent 55%),linear-gradient(135deg,#071d44,#0b3a8c);box-shadow:0 14px 34px rgba(11,58,140,.35);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:1.45rem;font-weight:800;line-height:1.25}
.hero p{opacity:.85;margin-top:4px;font-size:.95rem}
.hero .hl{flex:1;min-width:210px}
.hero .ring{width:104px;height:104px;flex:none}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero:after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:.95rem;background:var(--card);border:1px solid var(--line);color:var(--ink);transition:.15s;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,#1d4ed8,#2f7cf6);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.light{background:#fff;color:#0b2a5b;border-color:transparent}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.25)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem;border-radius:10px}
.btn.icon{padding:0;width:44px}
.btn.sm.icon{width:36px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.on{color:#e6a700;border-color:#e6a700}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.stat b{font-size:1.55rem;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:.8rem;color:var(--muted)}
.stat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--blueSoft);color:var(--blue);margin-bottom:6px}
.stat .ic.g{background:var(--okSoft);color:var(--ok)}.stat .ic.r{background:var(--badSoft);color:var(--bad)}.stat .ic.y{background:var(--warnSoft);color:var(--warn)}
.feat{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;transition:.2s;color:var(--ink);text-decoration:none;position:relative;min-width:0}
.feat:hover{transform:translateY(-3px);border-color:var(--blue2)}
.feat .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#0b2a5b,#2f7cf6)}
.feat .ic svg{width:1.4em;height:1.4em}
.feat b{font-size:1rem}.feat span{font-size:.82rem;color:var(--muted);line-height:1.35}
.feat .badge{position:absolute;top:12px;right:12px}
.badge{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--blueSoft);color:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.76rem;font-weight:700;background:var(--blueSoft);color:var(--blue);white-space:nowrap}
.chip.e{background:var(--okSoft);color:var(--ok)}.chip.m{background:var(--warnSoft);color:var(--warn)}.chip.h{background:var(--badSoft);color:var(--bad)}
.chip.neutral{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.bar{height:9px;border-radius:99px;background:var(--blueSoft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2563eb,#4f9bff);transition:width .4s}
.bar.e i{background:linear-gradient(90deg,#0f9d58,#4cd38a)}.bar.m i{background:linear-gradient(90deg,#e69a0c,#ffc65a)}.bar.h i{background:linear-gradient(90deg,#dc3c43,#ff8a8f)}
.lvrow{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:.88rem;margin:10px 0}
.lvrow small{color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.seg label{min-height:40px;padding:0 14px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;transition:.15s;cursor:pointer;user-select:none}
.seg .on{background:var(--blueSoft);border-color:var(--blue);color:var(--blue)}
.seg small{color:var(--muted);font-weight:500}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.lbl{font-size:.82rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.in{width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);outline:0;transition:.15s;min-width:0}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:0}
.tg small{display:block;color:var(--muted);font-size:.8rem}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:var(--line);flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw.on{background:var(--blue)}.sw.on:after{left:23px}
.note{padding:10px 12px;border-radius:12px;font-size:.88rem;background:var(--blueSoft);color:var(--ink)}
.note.err{background:var(--badSoft);color:var(--bad);font-weight:600}.note.warn{background:var(--warnSoft)}.note.ok{background:var(--okSoft);color:var(--ok);font-weight:600}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.5;margin-bottom:8px}
.q-card{padding:18px}
.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.q-text{font-size:1.1rem;font-weight:600;line-height:1.55;margin-bottom:16px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:58px;padding:10px 14px;border-radius:16px;background:var(--card2);border:2px solid var(--line);transition:.15s;overflow-wrap:anywhere;font-size:1.02rem;line-height:1.45}
.opt .key{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--card);border:1.5px solid var(--line);color:var(--muted);font-size:.9rem}
.opt .txt{flex:1;min-width:0}
.opt:hover:not([disabled]){border-color:var(--blue2);transform:translateX(2px)}
.opt.sel{border-color:var(--blue);background:var(--blueSoft)}.opt.sel .key{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}.opt.ok .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}.opt.bad .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.opt[disabled]{cursor:default}
.opt .tag{flex:none;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--card);color:var(--muted)}
.opt.ok .tag{color:var(--ok)}.opt.bad .tag{color:var(--bad)}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700;display:flex;gap:10px;align-items:center;animation:up .25s both}
.fb.ok{background:var(--okSoft);color:var(--ok)}.fb.bad{background:var(--badSoft);color:var(--bad)}
.runhead{position:sticky;top:0;z-index:15;margin:-16px -16px 14px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
@media (min-width:900px){.runhead{margin:-28px -32px 16px;padding:12px 32px}}
.runhead .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.3rem;padding:4px 14px;border-radius:12px;background:var(--navy);color:#fff;letter-spacing:.02em;flex:none}
.timer.warn{background:var(--warn);color:#201400;animation:pulse 1s infinite}
.timer.crit{background:var(--bad);color:#fff;animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.run{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:1000px){.run.hasPal{grid-template-columns:minmax(0,1fr) 290px;align-items:start}.run .pal{position:sticky;top:84px}}
.runbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.runbar .btn{flex:1}
.runbar .btn.icon{flex:none}
@media (min-width:900px){.runbar{position:static;background:none;border:0;box-shadow:none;padding:14px 0 0}}
.pal h3{font-size:.95rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pgrid button{height:40px;border-radius:10px;font-weight:700;font-size:.85rem;background:var(--card2);border:1.5px solid var(--line);position:relative}
.pgrid .a{background:var(--blueSoft);border-color:var(--blue2);color:var(--blue)}
.pgrid .ok{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.pgrid .bad{background:var(--badSoft);border-color:var(--bad);color:var(--bad)}
.pgrid .mk:after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--warn)}
.pgrid .cur{outline:3px solid var(--navy);outline-offset:1px}
:root[data-theme=dark] .pgrid .cur{outline-color:#fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:4px;vertical-align:-1px;border:1.5px solid}
@media (max-width:999px){.pal{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:72vh;overflow:auto;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .28s;padding-bottom:calc(16px + env(safe-area-inset-bottom));visibility:hidden}.pal-open .pal{transform:none;visibility:visible}.scrim{position:fixed;inset:0;z-index:45;background:rgba(5,12,30,.5);display:none}.pal-open .scrim{display:block}}
@media (min-width:1000px){.scrim{display:none!important}.pal .hide-d{display:none}}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:rgba(128,150,200,.25)}
.ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ringwrap{position:relative;display:grid;place-items:center;flex:none}
.ringwrap b{position:absolute;font-size:1.25rem;font-weight:800}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:9px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bc{fill:var(--blue)}.chart .bw{fill:var(--bad)}
.chart .ln{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--card);stroke:var(--blue);stroke-width:2.5}
.ql{display:flex;flex-direction:column;gap:10px}
.qi{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.qi>summary,.qi .qh{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer}
.qi>summary::-webkit-details-marker{display:none}
.qi .qn{flex:none;min-width:42px;font-weight:800;color:var(--blue);font-size:.9rem;padding-top:1px}
.qi .qt{flex:1;min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.qi[open] .qt{display:block;font-weight:600}
.qi .qb{padding:0 14px 14px}
.qi .st{width:10px;height:10px;border-radius:50%;flex:none;margin-top:8px;background:var(--line)}
.st.g{background:var(--ok)!important}.st.r{background:var(--bad)!important}.st.y{background:var(--blue2)!important}
.qi .opt{min-height:46px;padding:6px 10px;font-size:.95rem;cursor:default}
.qi .opt:hover{transform:none;border-color:var(--line)}
.qi .opt.ok:hover{border-color:var(--ok)}.qi .opt.bad:hover{border-color:var(--bad)}
.filters{position:sticky;top:0;z-index:10;display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.filters .wide{grid-column:1/-1}
@media (min-width:760px){.filters{grid-template-columns:2fr repeat(3,1fr) 1.2fr}.filters .wide{grid-column:auto}}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.toasts{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top));z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;max-width:520px;padding:11px 16px;border-radius:14px;background:var(--navy);color:#fff;font-weight:600;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:up .25s both}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}.toast.warn{background:var(--warn);color:#201400}
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(5,12,30,.55);animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.modal .box{width:100%;max-width:420px;max-height:90vh;overflow:auto;background:var(--card);border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:up .25s both}
.modal h3{font-size:1.15rem;margin-bottom:8px}.modal p{color:var(--muted);margin-bottom:16px;white-space:pre-line}
.modal .row{justify-content:flex-end}
.modal .more a{display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600}
.modal .more a:hover{background:var(--blueSoft)}
.modal.sheet{place-items:end center;padding:0}
.modal.sheet .box{border-radius:22px 22px 0 0;max-width:560px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}

 if(raw.progress&&typeof raw.progress==='object')for(const k in raw.progress){const id=+k,p=raw.progress[k];
  if(isId(id)&&Array.isArray(p)){const a=Math.floor(num(p[0],0,1e6,0)),c=Math.floor(num(p[1],0,1e6,0)),w=Math.floor(num(p[2],0,1e6,0));

  const total=items.length,b=total-c-w;
  d.exams.push({id:String(e.id||('x'+Math.random().toString(36).slice(2,8))).slice(0,20),name:String(e.name||'Bài thi').slice(0,80),ts:num(e.ts,0,4e12,Date.now()),

 if(raw.days&&typeof raw.days==='object')for(const k in raw.days){const v=raw.days[k];if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(v)){const a=Math.floor(num(v[0],0,1e6,0));d.days[k]=[a,Math.min(a,Math.floor(num(v[1],0,1e6,0)))]}}

 const items=[];for(const it of s.items){if(!it||!isId(it.id)||!Array.isArray(it.p)||it.p.length!==4||new Set(it.p).size!==4||it.p.some(x=>!(x>=0&&x<=3)))return null;items.push({id:it.id,p:it.p.slice()})}
 const n=items.length,arr=(a,f)=>Array.from({length:n},(_,i)=>Array.isArray(a)&&Number.isFinite(a[i])?a[i]:f);
 return{type:s.type,title:String(s.title||'').slice(0,80),items,a:arr(s.a,-1).map(x=>x>=0&&x<=3?x:-1),r:arr(s.r,0).map(x=>x?1:0),m:arr(s.m,0).map(x=>x?1:0),

}

 const ex=S.exams,avg=ex.length?ex.reduce((s,e)=>s+e.score,0)/ex.length:null;
 let st=0;const d=new Date();if(!(S.days[dkey(d)]&&S.days[dkey(d)][0]>0))d.setDate(d.getDate()-1);
 while(S.days[dkey(d)]&&S.days[dkey(d)][0]>0){st++;d.setDate(d.getDate()-1)}
 return{seen,okU,att,c,w,avg,streak:st,exams:ex.length,pct:Math.round(seen/Q.length*100)};
}

let AC=null;
function beep(ok){
 if(!S.settings.sound)return;
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const seq=ok?[[660,0],[880,.11]]:[[220,0],[160,.13]];
  seq.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'sawtooth';o.frequency.value=f;
   g.gain.setValueAtTime(.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.16,AC.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+.16);
   o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.18)});
 }catch(e){}
}

function toast(msg,kind){
 const box=$('#toasts'),t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;box.appendChild(t);
 setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},kind==='err'||kind==='warn'?4200:2400);
}
function modal(html,opts){
 opts=opts||{};return new Promise(res=>{
  const m=document.createElement('div');m.className='modal'+(opts.sheet?' sheet':'');m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
  m.innerHTML='<div class="box">'+html+'</div>';
  const close=v=>{document.removeEventListener('keydown',kd,true);m.remove();res(v)};
  const kd=e=>{if(e.key==='Escape'){e.stopPropagation();close(opts.cancelValue)}};
  m.addEventListener('click',e=>{if(e.target===m)close(opts.cancelValue);const b=e.target.closest('[data-m]');if(b)close(b.dataset.m==='1'?true:b.dataset.m==='0'?false:b.dataset.m)});
  document.addEventListener('keydown',kd,true);$('#modal').appendChild(m);const f=$('[data-focus]',m)||$('button',m);if(f)f.focus();
 });
}
function confirmBox(o){
 return modal('<h3>'+esc(o.title)+'</h3><p>'+esc(o.msg||'')+'</p><div class="row"><button class="btn" data-m="0">'+esc(o.cancel||'Hủy')+'</button><button class="btn '+(o.danger?'danger solid':'primary')+'" data-m="1" data-focus>'+esc(o.ok||'Đồng ý')+'</button></div>',{cancelValue:false});

function barChart(days){

 days.forEach((d,i)=>{const x=i*bw+bw*.18,w=bw*.64,hc=ph*d.c/max,hw=ph*d.w/max,y0=H-pb;
  g+='<rect class="bc" x="'+x.toFixed(1)+'" y="'+(y0-hc).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hc.toFixed(1)+'" rx="2"><title>'+d.label+': '+d.c+' đúng</title></rect>';
  g+='<rect class="bw" x="'+x.toFixed(1)+'" y="'+(y0-hc-hw).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hw.toFixed(1)+'" rx="2"><title>'+d.label+': '+d.w+' sai</title></rect>';
  if(n<=10||i%2===0)g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+d.label.slice(0,5)+'</text>'});

  case'unseen':return Q.filter(q=>!S.progress[q.id]||!S.progress[q.id][0]).map(q=>q.id);
  case'wrong':return Object.keys(S.wrong).map(Number).filter(isId).sort((a,b)=>a-b);
  case'fav':return Object.keys(S.fav).map(Number).filter(isId).sort((a,b)=>a-b);
  default:return Q.map(q=>q.id);
 }
}
const SRC_NAME={all:'Toàn bộ 601 câu',e:'Câu dễ',m:'Câu trung bình',h:'Câu khó',unseen:'Câu chưa làm',wrong:'Câu đã làm sai',fav:'Câu yêu thích',random:'Ngẫu nhiên'};
async function startPractice(c){
 let pool=poolFor(c.src==='random'?'all':c.src);
 if(!pool.length){toast('Không có câu hỏi nào phù hợp với lựa chọn này.','err');return}
 if(!(await guardNew()))return;
 let n=c.count==='all'?pool.length:Math.min(c.count,pool.length);
 if(c.count!=='all'&&pool.length<c.count)toast('Chỉ có '+pool.length+' câu phù hợp, sẽ luyện '+pool.length+' câu.','warn');
 const shuf=c.shuffleQ||c.src==='random';
 let ids=shuf?sample(pool,n):(n<pool.length?sample(pool,n).sort((a,b)=>a-b):pool);
 newSession({type:'practice',title:'Luyện tập · '+SRC_NAME[c.src],ids,shuffleO:c.shuffleO,immediate:c.immediate});
}
async function startExam(cfg){
 if(!(await guardNew()))return;
 let ids=cfg.ids;ids=cfg.shuffleQ?shuffle(ids):ids.slice().sort((a,b)=>a-b);
 newSession({type:'exam',title:cfg.name,ids,shuffleO:cfg.shuffleO,dur:cfg.dur*60,immediate:false});
}

const BK={q:'',lv:'all',st:'all',rs:'all',fav:false,from:'',to:'',lim:40};
function bankFilter(){
 const q=fold(BK.q.trim()),from=parseInt(BK.from,10)||1,to=parseInt(BK.to,10)||Q.length;
 return Q.filter(x=>{
  if(x.id<from||x.id>to)return false;
  if(BK.lv!=='all'&&x.lv!==BK.lv)return false;
  const p=S.progress[x.id];
  if(BK.st==='seen'&&!(p&&p[0]))return false;if(BK.st==='unseen'&&p&&p[0])return false;
  if(BK.rs==='ok'&&!(p&&p[3]===1))return false;if(BK.rs==='bad'&&!(p&&p[3]===0))return false;if(BK.rs==='everwrong'&&!(p&&p[2]>0))return false;
  if(BK.fav&&!S.fav[x.id])return false;
  if(q&&x.s.indexOf(q)<0)return false;
  return true}).map(x=>x.id);
}

Views.stats=function(){

  return '<div class="lvrow"><span class="chip '+k+'">'+LV[k].name+'</span><div class="bar '+k+'"><i style="width:'+(seen/TOT[k]*100).toFixed(1)+'%"></i></div><small>'+seen+'/'+TOT[k]+(a?' · '+Math.round(c/a*100)+'% đúng':'')+'</small></div>'}).join('');

 const hist=ex.length?'<div class="scroll-x"><table class="tbl"><thead><tr><th>Ngày</th><th>Đề thi</th><th>Điểm</th><th>Đúng</th><th>Thời gian</th><th></th></tr></thead><tbody>'+ex.slice(0,50).map(e=>'<tr><td>'+fmtDate(e.ts)+'</td><td>'+esc(e.name)+'</td><td><b>'+fmtScore(e.score)+'</b></td><td>'+e.c+'/'+e.total+'</td><td>'+fmtT(e.used)+'</td><td style="white-space:nowrap"><button class="btn sm" data-act="go" data-h="#/result/'+e.id+'">Chi tiết</button> <button class="btn sm icon danger" data-act="delexam" data-id="'+e.id+'" aria-label="Xóa">'+ic('trash')+'</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">'+ic('clock')+'<p>Chưa có bài thi nào hoàn thành.</p></div>';
 mount('<div class="page-h"><div><h1>Thống kê học tập</h1><p>Dữ liệu được lưu trong trình duyệt này.</p></div></div><div class="grid c4">'+

  '<div class="grid c2" style="margin-top:14px"><div class="card"><h2>Tiến độ theo mức độ</h2>'+lvl+'</div><div class="card"><h2>14 ngày gần nhất</h2>'+barChart(lastDays(14))+'</div></div>'+
  '<div class="card"><h2>Điểm các bài thi gần đây</h2>'+(ex.length?lineChart(ex.slice(0,20).reverse()):'<div class="empty" style="padding:16px">Chưa có dữ liệu.</div>')+'</div>'+
  '<div class="card"><h2>Lịch sử các lần thi</h2>'+hist+'</div>'+
  '<div class="card"><h2>Câu cần cải thiện</h2>'+(weak.length?'<div class="ql">'+weak.map(id=>qItem(id)).join('')+'</div>':'<p class="muted">Chưa có câu nào trả lời sai. Tuyệt vời!</p>')+'</div>');
};

/* ---------- Kết quả & xem lại bài thi ---------- */
const findExam=id=>S.exams.find(e=>e.id===id);
Views.result=function(id){
 const e=findExam(id);if(!e){go('#/stats');return}
 const grade=e.score>=8?'Xuất sắc':e.score>=6.5?'Khá tốt':e.score>=5?'Đạt':'Cần cố gắng thêm';
 const wrong=e.items.filter(it=>it[2]>=0&&Q[it[0]-1].a!==+it[1][it[2]]);
 mount('<section class="hero"><div class="hl"><p style="margin:0">'+esc(e.name)+' · '+fmtDate(e.ts)+'</p><div class="big-score" style="margin-top:6px">'+fmtScore(e.score)+'<span style="font-size:1.1rem;opacity:.7"> / 10</span></div><p>'+grade+' – '+e.pct+'% chính xác</p>'+
  '<div class="acts"><button class="btn light" data-act="go" data-h="#/review/'+e.id+'">Xem lại toàn bộ bài thi</button><button class="btn glass" data-act="csv" data-id="'+e.id+'">'+ic('download')+' Xuất CSV</button></div></div>'+ring(e.pct,104)+
  '<div class="res-grid" style="width:100%">'+[['Tổng số câu',e.total],['Câu đúng',e.c],['Câu sai',e.w],['Chưa trả lời',e.b],['Thời gian làm',fmtT(e.used)+(e.dur?' / '+fmtT(e.dur):'')],['Điểm (thang 10)',fmtScore(e.score)]].map(t=>'<div class="stat"><b>'+t[1]+'</b><span>'+t[0]+'</span></div>').join('')+'</div></section>'+
  '<div class="row mt" style="margin-top:14px"><button class="btn" data-act="retake" data-id="'+e.id+'">'+ic('refresh')+' Làm lại đề này</button>'+(wrong.length?'<button class="btn" data-act="retakewrong" data-id="'+e.id+'">'+ic('target')+' Luyện lại '+wrong.length+' câu sai</button>':'')+'<button class="btn" data-act="go" data-h="#/home">Về trang chủ</button></div>'+
  '<div class="card" style="margin-top:14px"><h2>Các câu trả lời sai ('+wrong.length+')</h2>'+(wrong.length?reviewCards(e.items,wrong.map(w=>w[0])):'<p class="muted">Không có câu nào sai. Xuất sắc!</p>')+'</div>');
};
let RVF='all';
function reviewCards(items,only){
 return '<div class="ql">'+items.map((it,k)=>{
  const q=Q[it[0]-1],perm=it[1].split('').map(Number),ans=it[2];
  if(only&&only.indexOf(it[0])<0)return '';
  const state=ans<0?'b':perm[ans]===q.a?'c':'w';
  if(RVF==='wrong'&&state!=='w')return'';if(RVF==='blank'&&state!=='b')return'';
  return '<div class="card q-card" style="margin:0"><div class="q-meta"><b>Câu '+(k+1)+'</b>'+lvChip(q)+'<span class="chip neutral">#'+q.id+'</span>'+
   (state==='c'?'<span class="chip e">Đúng</span>':state==='w'?'<span class="chip h">Sai</span>':'<span class="chip m">Chưa trả lời</span>')+'<button class="btn sm icon right noprint '+(S.fav[q.id]?'on':'')+'" data-act="fav" data-id="'+q.id+'" aria-label="Yêu thích">'+ic('star',S.fav[q.id]?'on':'')+'</button></div><div class="q-text">'+q.q+'</div>'+optsRO(q,perm,ans)+'</div>'}).join('')+'</div>';
}
Views.review=function(id){
 const e=findExam(id);if(!e){go('#/stats');return}
 const n=e.items.length;
 mount('<div class="page-h noprint"><div><h1>Xem lại bài thi</h1><p>'+esc(e.name)+' · '+fmtDate(e.ts)+' · '+fmtScore(e.score)+' điểm</p></div><div class="row"><button class="btn sm" data-act="go" data-h="#/result/'+e.id+'">'+ic('chevl')+' Kết quả</button><button class="btn sm" data-act="csv" data-id="'+e.id+'">'+ic('download')+' CSV</button><button class="btn sm" data-act="print">'+ic('print')+' In / PDF</button></div></div>'+
  '<div class="seg noprint" style="margin-bottom:14px">'+[['all','Tất cả ('+n+')'],['wrong','Câu sai ('+e.w+')'],['blank','Chưa làm ('+e.b+')']].map(f=>'<button class="'+(RVF===f[0]?'on':'')+'" data-act="rvf" data-v="'+f[0]+'" data-id="'+e.id+'">'+f[1]+'</button>').join('')+'</div>'+reviewCards(e.items));
};
function examCSV(e){
 const cell=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const rows=[['STT','ID câu','Mức độ','Câu hỏi','Đáp án đã chọn','Đáp án đúng','Kết quả']];
 e.items.forEach((it,k)=>{const q=Q[it[0]-1],perm=it[1].split('').map(Number),ans=it[2],ok=ans>=0&&perm[ans]===q.a,corr=perm.indexOf(q.a);
  rows.push([k+1,q.id,LV[q.lv].name,plain(q.q),ans<0?'(chưa trả lời)':LETTER[ans]+'. '+plain(q.o[perm[ans]]),LETTER[corr]+'. '+plain(q.o[q.a]),ans<0?'Chưa trả lời':ok?'Đúng':'Sai'])});
 const head=[['Đề thi',e.name],['Ngày thi',fmtDate(e.ts)],['Tổng số câu',e.total],['Đúng',e.c],['Sai',e.w],['Chưa trả lời',e.b],['Điểm (thang 10)',fmtScore(e.score)],['Chính xác',e.pct+'%'],['Thời gian làm',fmtT(e.used)],[]];
 return '﻿'+head.concat(rows).map(r=>r.map(cell).join(',')).join('\r\n');
}

/* ---------- Chế độ làm bài (học tập / luyện tập / thi thử) ---------- */
const remaining=()=>SESS&&SESS.endAt?Math.ceil((SESS.endAt-Date.now())/1000):null;
const timerText=()=>{const r=remaining();return r===null?fmtT((Date.now()-SESS.startedAt)/1000):fmtT(Math.max(0,r))};
const isCorrect=(k,pos)=>{const s=SESS,it=s.items[k];return Q[it.id-1].a===it.p[pos]};

function runHTML(){
 const s=SESS,n=s.items.length,k=s.pos,it=s.items[k],q=Q[it.id-1],isEx=s.type==='exam';
 const ans=s.a[k],rev=!isEx&&!!s.r[k],answered=s.a.filter(x=>x>=0).length;
 const prog=isEx?answered/n:(k+1)/n;
 let h='<div class="runhead"><div class="row" style="flex-wrap:nowrap;gap:8px"><button class="btn sm icon" data-act="exit" aria-label="Thoát">'+ic('chevl')+'</button><div class="t">'+esc(s.title)+'</div>'+
  (isEx?'<span class="timer" id="tmr">'+timerText()+'</span><button class="btn primary sm" data-act="submit">Nộp bài</button>':'<button class="btn sm" data-act="finish">Kết thúc</button>')+
  '</div><div class="bar" style="margin-top:8px"><i style="width:'+(prog*100).toFixed(1)+'%"></i></div><div class="row sp sm muted" style="margin-top:4px"><span>Câu '+(k+1)+'/'+n+'</span><span>Đã làm '+answered+'/'+n+'</span></div></div>';
 const meta='<div class="q-meta">'+(isEx?'':lvChip(q))+'<span class="chip neutral">'+(isEx?'Câu '+(k+1):'#'+q.id+' · '+LV[q.lv].name+' '+q.n)+'</span>'+
  '<span class="right row" style="gap:6px;flex-wrap:nowrap">'+
  (isEx?'<button class="btn sm '+(s.m[k]?'on':'')+'" data-act="mark">'+ic('flag',s.m[k]?'on':'')+' <span>'+(s.m[k]?'Đã đánh dấu':'Xem lại')+'</span></button>':
  '<button class="btn sm '+(S.wrong[q.id]?'on':'')+'" data-act="togwrong" data-id="'+q.id+'" title="Lưu câu này để ôn tập">'+ic('bookmark',S.wrong[q.id]?'on':'')+'</button>')+
  '<button class="btn sm '+(S.fav[q.id]?'on':'')+'" data-act="fav" data-id="'+q.id+'" aria-label="Yêu thích">'+ic('star',S.fav[q.id]?'on':'')+'</button></span></div>';
 let correctPos=-1;it.p.forEach((o,j)=>{if(o===q.a)correctPos=j});
 const opts='<div class="opts">'+it.p.map((o,j)=>{
  let cls='';
  if(rev){cls=j===correctPos?'ok':j===ans?'bad':'dim'}else if(j===ans)cls='sel';
  return '<button class="opt '+cls+'" data-act="pick" data-i="'+j+'"'+(rev?' disabled':'')+' aria-pressed="'+(j===ans)+'"><span class="key">'+LETTER[j]+'</span><span class="txt">'+q.o[o]+'</span>'+
   (rev&&j===correctPos?'<span class="tag">Đúng</span>':rev&&j===ans?'<span class="tag">Sai</span>':'')+'</button>'}).join('')+'</div>';
 let fb='';
 if(rev){const ok=ans===correctPos;fb='<div class="fb '+(ok?'ok':'bad')+'" role="status">'+ic(ok?'check':'x')+'<span>'+(ok?'Chính xác!':'Chưa đúng. Đáp án đúng là '+LETTER[correctPos]+'.')+'</span></div>'+(q.flag?'<div class="note warn mt">'+esc(q.flag)+'</div>':'')}
 const card='<div class="card q-card">'+meta+'<div class="q-text">'+q.q+'</div>'+opts+fb+'</div>';
 const pal='<aside class="pal card"><h3><span>Danh sách câu</span><button class="btn sm icon hide-d" data-act="pal" aria-label="Đóng">'+ic('x')+'</button></h3><div class="pgrid">'+
  s.items.map((x,i)=>{let c='';if(isEx){if(s.a[i]>=0)c='a';if(s.m[i])c+=' mk'}else if(s.r[i]){c=isCorrect(i,s.a[i])?'ok':'bad'}else if(s.a[i]>=0)c='a';
   if(i===k)c+=' cur';return '<button class="'+c+'" data-act="goto" data-i="'+i+'" aria-label="Câu '+(i+1)+'">'+(i+1)+'</button>'}).join('')+'</div>'+
  '<div class="legend">'+(isEx?'<span><i style="background:var(--blueSoft);border-color:var(--blue2)"></i>Đã làm</span><span><i style="background:var(--warn);border-color:var(--warn)"></i>Xem lại</span><span><i style="background:var(--card2);border-color:var(--line)"></i>Chưa làm</span>':'<span><i style="background:var(--okSoft);border-color:var(--ok)"></i>Đúng</span><span><i style="background:var(--badSoft);border-color:var(--bad)"></i>Sai</span><span><i style="background:var(--blueSoft);border-color:var(--blue2)"></i>Đã chọn</span>')+'</div></aside>';
 const last=k===n-1;
 const mid=!isEx&&!s.immediate&&!s.r[k]&&ans>=0?'<button class="btn primary" data-act="reveal">Kiểm tra</button>':'';
 const bar='<div class="runbar"><button class="btn icon" data-act="pal" aria-label="Danh sách câu">'+ic('grid')+'</button><button class="btn" data-act="nav" data-d="-1" '+(k===0?'disabled':'')+'>'+ic('chevl')+' Trước</button>'+mid+
  (last?'<button class="btn primary" data-act="'+(isEx?'submit':'finish')+'">'+(isEx?'Nộp bài':'Hoàn thành')+'</button>':'<button class="btn '+(mid?'':'primary')+'" data-act="nav" data-d="1">Tiếp '+ic('chevr')+'</button>')+'</div>';
 return h+'<div class="run hasPal"><div>'+card+'</div>'+pal+'</div><div class="scrim" data-act="pal"></div>'+bar;
}
function renderRun(top){
 const y=window.scrollY;VIEW.innerHTML=runHTML();
 if(top)window.scrollTo(0,0);else window.scrollTo(0,y);
}
Views.run=function(){
 if(SESS.finished){summaryView();return}
 mount(runHTML());
};
function persistPos(){if(SESS.type==='study'){S.studyPos[SESS.key]=SESS.pos;save()}saveSession()}
function pickOpt(i){
 const s=SESS;if(!s||s.finished)return;const k=s.pos,isEx=s.type==='exam';
 if(!isEx&&s.r[k])return;
 if(isEx&&s.a[k]===i)s.a[k]=-1;else s.a[k]=i;
 if(!isEx&&s.immediate)revealQ(k);
 saveSession();renderRun(false);
}
function revealQ(k){
 const s=SESS;if(s.r[k]||s.a[k]<0)return;s.r[k]=1;const ok=isCorrect(k,s.a[k]);
 record(s.items[k].id,ok);save();beep(ok);
}
function finishPractice(){
 const s=SESS;s.a.forEach((a,k)=>{if(a>=0&&!s.r[k]){s.r[k]=1;record(s.items[k].id,isCorrect(k,a))}});
 s.finished=true;if(s.type==='study')S.studyPos[s.key]=0;save();saveSession();RVF='all';go('#/run');route();
}
function summaryView(){
 const s=SESS,n=s.items.length;let c=0,w=0;s.a.forEach((a,k)=>{if(a>=0){isCorrect(k,a)?c++:w++}});const b=n-c-w,pct=n?Math.round(c/n*1000)/10:0;
 const items=s.items.map((it,k)=>[it.id,it.p.join(''),s.a[k]]);
 mount('<section class="hero"><div class="hl"><p style="margin:0">'+esc(s.title)+'</p><div class="big-score" style="margin-top:6px">'+c+'<span style="font-size:1.1rem;opacity:.7"> / '+n+' câu đúng</span></div><p>Chính xác '+pct+'% · '+w+' câu sai · '+b+' câu chưa làm</p>'+
  '<div class="acts">'+(w?'<button class="btn light" data-act="sumwrong">'+ic('target')+' Luyện lại câu sai</button>':'')+'<button class="btn glass" data-act="endsess" data-h="#/'+(s.type==='study'?'study':'practice')+'">'+(s.type==='study'?'Về Học tập':'Luyện tập mới')+'</button><button class="btn glass" data-act="endsess" data-h="#/home">Trang chủ</button></div></div>'+ring(pct,104)+'</section>'+
  '<div class="seg" style="margin:14px 0">'+[['all','Tất cả'],['wrong','Câu sai'],['blank','Chưa làm']].map(f=>'<button class="'+(RVF===f[0]?'on':'')+'" data-act="rvf2" data-v="'+f[0]+'">'+f[1]+'</button>').join('')+'</div>'+reviewCards(items));
}
async function submitExam(auto){
 const s=SESS;if(!s||s.type!=='exam'||s.finished)return;
 if(!auto){
  const un=s.a.filter(x=>x<0).length,mk=s.m.filter(Boolean).length;
  const ok=await confirmBox({title:'Nộp bài thi?',msg:(un?'Còn '+un+' câu chưa trả lời.':'Bạn đã trả lời tất cả câu hỏi.')+(mk?'\nCó '+mk+' câu đang được đánh dấu xem lại.':'')+'\nSau khi nộp sẽ không thể chỉnh sửa.',ok:'Nộp bài'});
  if(!ok||SESS!==s)return;
 }
 let c=0,w=0;
 s.items.forEach((it,k)=>{const a=s.a[k];if(a>=0){const ok=isCorrect(k,a);ok?c++:w++;record(it.id,ok)}});
 const total=s.items.length,b=total-c-w,elapsed=Math.round((Date.now()-s.startedAt)/1000);
 const rec={id:'x'+Date.now().toString(36),name:s.title,ts:Date.now(),total,c,w,b,score:Math.round(c/total*1000)/100,pct:Math.round(c/total*1000)/10,
  used:s.dur?(auto?s.dur:Math.min(s.dur,elapsed)):elapsed,dur:s.dur,items:s.items.map((it,k)=>[it.id,it.p.join(''),s.a[k]])};
 S.exams.unshift(rec);if(S.exams.length>300)S.exams.length=300;
 SESS=null;saveSession();save();
 if(auto)toast('Hết giờ – bài thi đã được nộp tự động.','warn');
 RVF='all';go('#/result/'+rec.id);
}
function updatePill(){
 const p=$('#pill');if(!p)return;
 if(examActive()&&ROUTE!=='run'){p.classList.add('show');p.innerHTML=ic('clock')+'<span>Đang thi · <b id="pilt">'+timerText()+'</b></span>'}else p.classList.remove('show');
}
function tick(){
 if(!examActive())return;
 const r=remaining(),el=$('#tmr');
 if(el){el.textContent=timerText();el.className='timer'+(r!==null&&r<=60?' crit':r!==null&&r<=300?' warn':'')}
 const pt=$('#pilt');if(pt)pt.textContent=timerText();
 if(r!==null){
  if(r<=0){submitExam(true);return}
  if(r<=60&&SESS.warn<2){SESS.warn=2;saveSession();toast('Chỉ còn 1 phút!','err')}
  else if(r<=300&&SESS.warn<1){SESS.warn=1;saveSession();toast('Còn 5 phút – hãy kiểm tra lại bài.','warn')}
 }
}

/* ---------- Hành động (event delegation) ---------- */
function refreshItem(id){
 $$('.qi[data-id="'+id+'"]').forEach(el=>{const open=el.open,w=el.dataset.w==='1';const t=document.createElement('div');t.innerHTML=qItem(id,{wrong:w});const n=t.firstChild;if(open)n.open=true;el.replaceWith(n)});
}
function afterToggle(id){
 if(ROUTE==='run'){renderRun(false)}
 else{refreshItem(id);$$('[data-act=fav][data-id="'+id+'"]').forEach(b=>{if(b.closest('.qi'))return;const on=!!S.fav[id];b.classList.toggle('on',on);const sv=$('svg',b);if(sv)sv.classList.toggle('on',on)})}
 chrome();
}
function applyTheme(){
 const t=S.settings.theme,dark=t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
 document.documentElement.setAttribute('data-theme',dark?'dark':'light');
 document.documentElement.style.setProperty('--fscale',S.settings.font/100);
 const m=$('meta[name=theme-color]');if(m)m.content=dark?'#0a1226':'#f2f6fd';
}
const Act={
 go(el){go(el.dataset.h)},
 themeToggle(){const dark=document.documentElement.getAttribute('data-theme')==='dark';S.settings.theme=dark?'light':'dark';save();applyTheme();if(ROUTE==='settings')Views.settings()},
 more(){modal('<h3>Chức năng khác</h3><div class="more">'+NAV.filter(n=>BNAV.indexOf(n[0])<0&&n[0]!=='home').map(n=>'<a href="#/'+n[0]+'" data-m="x">'+ic(n[2])+n[1]+'</a>').join('')+'</div>',{sheet:true});},
 resume(){go('#/run')},
 study(el){startStudy(el.dataset.k,el.dataset.pos===undefined?undefined:+el.dataset.pos)},
 jump(){const v=parseInt($('#jump').value,10);if(!(v>=1&&v<=Q.length)){toast('Nhập số từ 1 đến '+Q.length,'err');return}startStudy('all',v-1)},
 tog(el){const k=el.dataset.k;S.settings[k]=!S.settings[k];save();Views[ROUTE]()},
 pr(el){const f=el.dataset.f,v=el.dataset.v;
  if(f==='src')PR.src=v;else if(f==='count')PR.count=v==='all'?'all':+v;else if(f==='immediate')PR.immediate=!(PR.immediate===null?S.settings.immediate:PR.immediate);else PR[f]=!PR[f];Views.practice()},
 startpr(){startPractice({src:PR.src,count:PR.count,shuffleQ:PR.shuffleQ,shuffleO:PR.shuffleO,immediate:PR.immediate===null?S.settings.immediate:PR.immediate})},
 prsrc(el){PR.src=el.dataset.s;PR.count='all';PR.shuffleQ=true;startPractice({src:PR.src,count:'all',shuffleQ:true,shuffleO:false,immediate:S.settings.immediate})},
 expre(el){EX.count=+el.dataset.n;EX.dur=+el.dataset.d;Views.exam()},
 exlv(el){EX.levels[el.dataset.k]=EX.levels[el.dataset.k]?0:1;Views.exam()},
 extog(el){EX[el.dataset.f]=!EX[el.dataset.f];Views.exam()},
 startex(){doStartExam()},
 crprop(){const T=Q.length;let e=Math.round(CR.total*TOT.e/T),m=Math.round(CR.total*TOT.m/T),h=CR.total-e-m;if(h<0){h=0;m=CR.total-e}CR.e=e;CR.m=m;CR.h=h;Views.create()},
 crex(){Object.assign(CR,{total:50,e:20,m:20,h:10,dur:45});Views.create()},
 crtog(el){CR[el.dataset.f]=!CR[el.dataset.f];Views.create()},
 startcr(){doStartCreate()},
 bkmore(){BK.lim+=40;bankList()},
 bkfav(){BK.fav=!BK.fav;BK.lim=40;Views.bank()},
 bkreset(){Object.assign(BK,{q:'',lv:'all',st:'all',rs:'all',fav:false,from:'',to:'',lim:40});Views.bank()},
 fav(el){const id=+el.dataset.id;if(S.fav[id])delete S.fav[id];else S.fav[id]=1;save();afterToggle(id)},
 togwrong(el){const id=+el.dataset.id;if(S.wrong[id]){delete S.wrong[id];toast('Đã bỏ khỏi danh sách câu sai')}else{S.wrong[id]=1;toast('Đã lưu vào danh sách câu sai','ok')}save();afterToggle(id)},
 unwrong(el){delete S.wrong[+el.dataset.id];save();Views.wrong();chrome();toast('Đã xóa khỏi danh sách câu sai','ok')},
 async clearwrong(){if(await confirmBox({title:'Xóa toàn bộ danh sách câu sai?',msg:'Lịch sử làm bài vẫn được giữ nguyên.',ok:'Xóa tất cả',danger:true})){S.wrong={};save();Views.wrong();chrome()}},
 async one(el){if(!(await guardNew()))return;const id=+el.dataset.id;newSession({type:'practice',title:'Làm câu #'+id,ids:[id],shuffleO:false})},
 async delexam(el){if(await confirmBox({title:'Xóa bài thi này khỏi lịch sử?',msg:'Thống kê điểm trung bình sẽ được tính lại.',ok:'Xóa',danger:true})){S.exams=S.exams.filter(e=>e.id!==el.dataset.id);save();Views.stats()}},
 theme(el){S.settings.theme=el.dataset.v;save();applyTheme();Views.settings()},
 export(){download('quizmaster-sao-luu-'+dkey()+'.json',JSON.stringify({app:'quizmaster-hoa-phan-tich',version:1,exportedAt:new Date().toISOString(),data:S},null,1));toast('Đã xuất file sao lưu','ok')},
 import(){const f=$('#impf');f.value='';f.click()},
 async reset(){
  if(!(await confirmBox({title:'Xóa toàn bộ lịch sử học tập?',msg:'Tiến độ, câu sai, câu yêu thích, lịch sử thi và thống kê sẽ bị xóa vĩnh viễn. Hãy xuất sao lưu trước nếu cần.',ok:'Xóa lịch sử',danger:true})))return;
  const st=S.settings;S=defaults();S.settings=st;SESS=null;save();saveSession();chrome();Views.settings();toast('Đã xóa lịch sử học tập','ok')},
 csv(el){const e=findExam(el.dataset.id);if(e)download('ketqua-'+dkey(new Date(e.ts))+'.csv',examCSV(e),'text/csv;charset=utf-8')},
 print(){window.print()},
 rvf(el){RVF=el.dataset.v;Views.review(el.dataset.id)},
 rvf2(el){RVF=el.dataset.v;summaryView()},
 async retake(el){const e=findExam(el.dataset.id);if(!e||!(await guardNew()))return;
  newSession({type:'exam',title:e.name.replace(/ \(làm lại\)$/,'')+' (làm lại)',ids:e.items.map(i=>i[0]),shuffleO:true,dur:e.dur})},
 async retakewrong(el){const e=findExam(el.dataset.id);if(!e||!(await guardNew()))return;
  const ids=e.items.filter(it=>it[2]>=0&&Q[it[0]-1].a!==+it[1][it[2]]).map(it=>it[0]);newSession({type:'practice',title:'Luyện lại câu sai',ids:shuffle(ids),shuffleO:false})},
 async sumwrong(){const s=SESS,ids=[];s.items.forEach((it,k)=>{if(s.a[k]>=0&&!isCorrect(k,s.a[k]))ids.push(it.id)});
  newSession({type:'practice',title:'Luyện lại câu sai',ids:shuffle(ids),shuffleO:false})},
 endsess(el){SESS=null;saveSession();go(el.dataset.h)},
 /* Runner */
 pick(el){pickOpt(+el.dataset.i)},
 reveal(){revealQ(SESS.pos);saveSession();renderRun(false)},
 mark(){SESS.m[SESS.pos]=SESS.m[SESS.pos]?0:1;saveSession();renderRun(false)},
 nav(el){const s=SESS,p=clamp(s.pos+ +el.dataset.d,0,s.items.length-1);if(p!==s.pos){s.pos=p;persistPos();renderRun(true)}},
 goto(el){SESS.pos=+el.dataset.i;persistPos();document.body.classList.remove('pal-open');renderRun(true)},
 pal(){document.body.classList.toggle('pal-open')},
 async exit(){
  const s=SESS;
  if(s.type==='exam'){if(!(await confirmBox({title:'Rời khỏi bài thi?',msg:'Đồng hồ vẫn tiếp tục chạy. Bạn có thể quay lại làm tiếp từ Trang chủ hoặc nút “Đang thi”.',ok:'Rời đi'})))return;go('#/home')}
  else go(s.type==='study'?'#/study':'#/practice');
 },
 finish(){
  const s=SESS,un=s.a.filter(x=>x<0).length;
  if(!un||s.type==='study'&&un===s.items.length){finishPractice();return}
  confirmBox({title:'Kết thúc phiên này?',msg:'Còn '+un+' câu chưa làm. Các câu đã chọn sẽ được ghi nhận vào thống kê.',ok:'Kết thúc'}).then(ok=>{if(ok)finishPractice()});
 },
 submit(){submitExam(false)}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(el){e.preventDefault();const f=Act[el.dataset.act];if(f)f(el);return}
 const a=e.target.closest('a[href^="#/"]');
 if(a&&a.closest('.modal')){e.preventDefault();const m=a.closest('.modal');m.remove();go(a.getAttribute('href'))}
});
/* Ô nhập liệu */
document.addEventListener('input',e=>{
 const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
 const iv=()=>{const v=parseInt(el.value,10);return Number.isFinite(v)?Math.max(0,v):0};
 if(k==='excount'){EX.count=iv()}
 else if(k==='exdur'){EX.dur=iv()}
 else if(k.startsWith('cr_')){const f=k.slice(3);if(f==='name')CR.name=el.value;else CR[f]=iv();$('#crstat').innerHTML=crStatHTML(crStatus())}
 else if(k.startsWith('bk_')){BK[k.slice(3)]=el.value;BK.lim=40;bankList()}
 else if(k==='font'){S.settings.font=+el.value;$('#fsv').textContent=el.value+'%';applyTheme();save()}
 else if(k==='name'){S.settings.name=el.value.slice(0,30);save()}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='impf'&&el.files&&el.files[0]){
  const f=el.files[0],r=new FileReader();
  r.onload=async()=>{
   try{
    const o=JSON.parse(r.result);
    if(!o||typeof o!=='object'||!o.data||typeof o.data!=='object'||(o.app&&o.app!=='quizmaster-hoa-phan-tich'))throw new Error('bad');
    const clean=sanitize(o.data),n=Object.keys(clean.progress).length;
    if(!(await confirmBox({title:'Nhập dữ liệu sao lưu?',msg:'File chứa '+n+' câu đã học, '+clean.exams.length+' bài thi, '+Object.keys(clean.wrong).length+' câu sai, '+Object.keys(clean.fav).length+' câu yêu thích.\nDữ liệu hiện tại trên trình duyệt này sẽ bị thay thế.',ok:'Nhập & thay thế'})))return;
    S=clean;SESS=null;save();saveSession();applyTheme();chrome();route();toast('Đã khôi phục dữ liệu thành công','ok');
   }catch(err){toast('File không hợp lệ. Hãy chọn file JSON do chính phần mềm này xuất ra.','err')}
  };
  r.onerror=()=>toast('Không đọc được file.','err');r.readAsText(f);
 }else if(el.dataset&&el.dataset.in&&el.tagName==='SELECT'){/* handled by input */}
});
/* Phím tắt */
document.addEventListener('keydown',e=>{
 if(ROUTE!=='run'||!SESS||SESS.finished)return;
 if($('#modal').children.length)return;
 const t=e.target;if(t&&/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))return;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key.toLowerCase(),s=SESS,isEx=s.type==='exam';
 const idx='1234'.indexOf(k)>=0&&k.length===1?+k-1:'abcd'.indexOf(k)>=0&&k.length===1?'abcd'.indexOf(k):-1;
 if(idx>=0){e.preventDefault();pickOpt(idx);return}
 if(k==='arrowright'){e.preventDefault();if(s.pos<s.items.length-1){s.pos++;persistPos();renderRun(true)}}
 else if(k==='arrowleft'){e.preventDefault();if(s.pos>0){s.pos--;persistPos();renderRun(true)}}
 else if(k==='enter'){e.preventDefault();if(t&&t.tagName==='BUTTON')return;
  if(!isEx&&!s.immediate&&!s.r[s.pos]&&s.a[s.pos]>=0){revealQ(s.pos);saveSession();renderRun(false)}
  else if(s.pos<s.items.length-1){s.pos++;persistPos();renderRun(true)}}
 else if(k==='f'){const id=s.items[s.pos].id;if(S.fav[id])delete S.fav[id];else S.fav[id]=1;save();afterToggle(id)}
 else if(k==='m'&&isEx){s.m[s.pos]=s.m[s.pos]?0:1;saveSession();renderRun(false)}
 else if(k==='l'){document.body.classList.toggle('pal-open')}
 else if(k==='escape'){document.body.classList.remove('pal-open')}
});

/* ---------- Khởi động ---------- */
function init(){
 loadState();loadSession();applyTheme();
 if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
 window.addEventListener('hashchange',route);
 setInterval(tick,1000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
 window.addEventListener('storage',ev=>{if(ev.key===KEY&&ev.newValue){loadState();chrome()}});
 if(!location.hash)history.replaceState(null,'','#/home');
 route();
 if(examActive()&&remaining()!==null&&remaining()<=0)submitExam(true);
}
window.__QM={get S(){return S},get SESS(){return SESS},Q,sanitize,route};
init();
})();
